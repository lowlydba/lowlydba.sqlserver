name: CI (Windows)
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - stable-*
    paths-ignore:
      - .github/workflows/docs*.yml
      - .github/workflows/github-release.yml
      - changelogs/fragments/*.yml
      - .vscode/*
  pull_request:
    paths-ignore:
      - .github/workflows/docs*.yml
      - .github/workflows/github-release.yml
      - changelogs/fragments/*.yml
      - .vscode/*

  # Run CI once per day (at 06:00 UTC)
  # This ensures that even if there haven't been commits that we are still testing against latest version of ansible-test for each ansible-base version
  schedule:
    - cron: "0 8 * * *"

# Cancel existing runs on new commits to a branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Deny all permissions at workflow level - scope per job
permissions: {}

env:
  NAMESPACE: lowlydba
  COLLECTION_NAME: sqlserver
  DBATOOLS_VERSION: "2.0.0"

jobs:
  ###
  # Integration tests (RECOMMENDED)
  #
  # https://docs.ansible.com/ansible/latest/dev_guide/testing_integration.html

  integration:
    runs-on: ${{ matrix.os }}
    name: I (Ⓐ${{ matrix.ansible }}+win-2025|grp${{ matrix.group }})
    # Historically ~17m avg, ~21m max; guard against hung WSL/SQL Server setup
    timeout-minutes: 45
    continue-on-error: ${{ matrix.ansible == 'devel' }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2025
        wsl:
          - Ubuntu-24.04
        ansible:
          - stable-2.19
          - stable-2.20
          - stable-2.21
          - devel
        python:
          - python3
        group: # windows/group/#/
          - "1"
          - "2"
          #- '3'
    defaults:
      run:
        shell: wsl-bash {0}

    permissions:
      # Required for uploading coverage reports
      contents: write  # Required for uploading coverage reports
      # Required for OIDC token authentication
      id-token: write  # Required for OIDC token authentication
    env:
      NAMESPACE: lowlydba  # zizmor: ignore[template-injection] -- Static value
      COLLECTION_NAME: sqlserver  # zizmor: ignore[template-injection] -- Static value
      GROUP: ${{ matrix.group }}  # zizmor: ignore[template-injection] -- Matrix value from controlled environment
      PYTHON: python3
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}  # zizmor: ignore[secrets-outside-env] -- Codecov token needed for coverage uploads; environment protection would block PR-triggered runs
      WORKSPACE: ${{ github.workspace }}
      # Relative to github.workspace, which is also the default cwd for wsl-bash steps below.
      # wsl.exe transparently maps that Windows path into WSL via drvfs, so the same files on
      # disk can be cached directly by actions/cache (running on the Windows host) without
      # reaching into the WSL rootfs (where pip's real default cache dir would otherwise live).
      PIP_CACHE_DIR: .pip-cache

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ansible_collections/${{env.NAMESPACE}}/${{env.COLLECTION_NAME}}
          persist-credentials: false

      - name: Create an admin user  # zizmor: ignore[misfeature] -- Windows-specific cmd required for net user commands; pwsh cannot create local users
        shell: cmd
        run: |
          net user admin pass123@ /add /y
          net localgroup Administrators admin /add

      - name: Set up the runner for PowerShell remoting
        shell: powershell
        run: |
          # Pinned to a commit in the current home of this script; latest version at
          # https://github.com/ansible/ansible-documentation/blob/devel/examples/scripts/ConfigureRemotingForAnsible.ps1
          $sb = [ScriptBlock]::Create((New-Object System.Net.Webclient).DownloadString('https://raw.githubusercontent.com/ansible/ansible-documentation/b8cf495929aa200a11abc7468d1fb6cd9c0e1613/examples/scripts/ConfigureRemotingForAnsible.ps1'))
          & $sb -Verbose -ForceNewSSLCert 4>&1

      - name: Add a hosts entry  # zizmor: ignore[misfeature] -- Windows-specific cmd required for hosts file modification
        shell: cmd
        run: echo 127.0.0.1 sqlserver >> "%WinDir%\System32\Drivers\etc\hosts"

      - uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
        with:
          distribution: ${{ matrix.wsl }}
          update: "false"
          use-cache: "true"
          wsl-version: 1

      # archive.ubuntu.com/security.ubuntu.com occasionally serve a Packages file that doesn't
      # match the just-fetched InRelease hash (mirror mid-sync). Retrying almost always succeeds,
      # so do our own apt-get here instead of relying on setup-wsl's one-shot additional-packages.
      - name: Install WSL packages (with retry)  # zizmor: ignore[template-injection] -- matrix.python is a controlled enum value (python3)
        run: |
          echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/80-retries > /dev/null
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y git ${{ matrix.python }} python3-pip openssh-client; then
              exit 0
            fi
            echo "apt-get failed (attempt $attempt), retrying..."
            sleep 10
          done
          exit 1

      - name: Get Linux workspace path
        shell: pwsh
        run: |
          # $ws = & wslpath --% -u -a "$env:WORKSPACE""
          # seems wslpath is not available on server 2019

          function ConvertTo-LinuxPathCrappy {
              [CmdletBinding()]
              param(
                  [Parameter(Mandatory)]
                  [ValidateNotNullOrEmpty()]
                  [string]
                  $LiteralPath
              )

              End {
                  $resolved = Resolve-Path -LiteralPath $LiteralPath
                  $drive = ($resolved | Split-Path -Qualifier).TrimEnd(':').ToLower()
                  $rooted = ($resolved | Split-Path -NoQualifier).Replace('\', '/').TrimStart('/')

                  '/mnt/{0}/{1}' -f $drive, $rooted
              }
          }
          $ws = ConvertTo-LinuxPathCrappy -LiteralPath "$env:WORKSPACE"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "GHWS=$ws"

      - name: Cache pip downloads/wheels
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-pip-${{ matrix.ansible }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Override break-sys-pkg defaults, because we don't need to bother with python venv for CI
      #
      # ansible-core devel requires Python >= 3.13 (see pyproject.toml on the devel branch),
      # which isn't packaged in the Ubuntu-24.04 WSL image used here (default python3 is 3.12).
      # actions/setup-python only provisions the Windows host, not this WSL guest, so install a
      # standalone Python 3.13 via uv for that leg instead of an apt/PPA install.
      - name: Install ansible-base (${{ matrix.ansible }})  # zizmor: ignore[template-injection] -- matrix.ansible is a controlled enum value (stable-2.19, stable-2.20, devel)
        run: |
          PYTHON_BIN=python3
          if [ "${{ matrix.ansible }}" = "devel" ]; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
            "$HOME/.local/bin/uv" python install 3.13
            PYTHON_BIN="$("$HOME/.local/bin/uv" python find 3.13)"
          fi
          "$PYTHON_BIN" -m pip config set global.break-system-packages true
          "$PYTHON_BIN" -m pip install --upgrade setuptools pypsrp --disable-pip-version-check --retries 10
          "$PYTHON_BIN" -m pip install "https://github.com/ansible/ansible/archive/${{ matrix.ansible }}.tar.gz" --disable-pip-version-check --retries 10
          if [ "${{ matrix.ansible }}" = "devel" ]; then
            # uv's standalone Python isn't on PATH, and its console scripts don't land in
            # /usr/local/bin like the system python3 case does, so symlink them there for later
            # wsl-bash steps (each one is a fresh --norc/--noprofile shell, nothing persists).
            BIN_DIR="$(dirname "$PYTHON_BIN")"
            for SCRIPT in ansible ansible-config ansible-console ansible-doc ansible-galaxy ansible-inventory ansible-playbook ansible-pull ansible-vault ansible-test; do
              if [ -x "$BIN_DIR/$SCRIPT" ]; then
                ln -sf "$BIN_DIR/$SCRIPT" "/usr/local/bin/$SCRIPT"
              fi
            done
          fi

      - name: Install collection dependencies
        id: collection-dependency
        # zizmor: ignore[template-injection] -- GHWS is dynamically computed earlier in the workflow
        run: ansible-galaxy collection install ansible.windows -p "${{ env.GHWS }}"
        continue-on-error: true

      - name: Retry install collection dependencies
        if: steps.collection-dependency.outcome == 'failure'
        # zizmor: ignore[template-injection] -- GHWS is dynamically computed earlier in the workflow
        run: ansible-galaxy collection install ansible.windows -p "${{ env.GHWS }}"

      - name: Set integration test options
        working-directory: ./ansible_collections/${{env.NAMESPACE}}/${{env.COLLECTION_NAME}}/tests/integration
        run: |
          cp integration_config.sample.yml integration_config.yml
          cp inventory.winrm.ci inventory.winrm

      - name: Install SQL Server
        continue-on-error: true
        id: mssqlsuite
        uses: potatoqualitee/mssqlsuite@2291d923e83859edd871679c05b379037376761f # v1.12
        with:
          install: sqlengine
          sa-password: L0wlydb4
          version: 2022

      - name: Retry SQL Server install
        id: retry1
        if: steps.mssqlsuite.outcome == 'failure'
        uses: potatoqualitee/mssqlsuite@2291d923e83859edd871679c05b379037376761f # v1.12
        with:
          install: sqlengine
          sa-password: L0wlydb4
          version: 2022

      - name: Run integration test  # zizmor: ignore[template-injection] -- env.GHWS is a computed path; matrix values are controlled enums
        run: |
          pushd "${{ env.GHWS }}/ansible_collections/${{env.NAMESPACE}}/${{env.COLLECTION_NAME}}"
          ansible-test windows-integration -v --color --retry-on-error --continue-on-error --diff --coverage --requirements windows/group/${{ matrix.group }}/

      - name: Generate coverage report  # zizmor: ignore[template-injection] -- env.GHWS is a computed path
        run: |
          pushd "${{ env.GHWS }}/ansible_collections/${{env.NAMESPACE}}/${{env.COLLECTION_NAME}}"
          ansible-test coverage xml -v --requirements

      # See the reports at https://codecov.io/gh/lowlydba/lowlydba.sqlserver
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          fail_ci_if_error: false

  win-ci-test-rollup:
    name: Are we good? (Windows)
    runs-on: ubuntu-slim
    needs: [integration]
    if: always()
    steps:
      - uses: lowlydba/are-we-good@f506ed6324f55ec5e4ff5d92204a72c7f1c2b4f8 # v1.0.5
        with:
          jobs: ${{ toJSON(needs) }}
