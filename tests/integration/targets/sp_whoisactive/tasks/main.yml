---
- name: Var block
  vars:
    target_database: "master"
    whoisactive_prefetched_file: "{{ lookup('ansible.builtin.env', 'WHOISACTIVE_LOCAL_FILE') }}"
    whoisactive_local_file: "{{ whoisactive_prefetched_file or '/tmp/sp_WhoIsActive.sql' }}"
  module_defaults:
    lowlydba.sqlserver.sp_whoisactive:
      sql_instance: "{{ sqlserver_instance }}"
      sql_username: "{{ sqlserver_username }}"
      sql_password: "{{ sqlserver_password }}"
      database: "{{ target_database }}"
      local_file: "{{ whoisactive_local_file }}"
  tags: ["sp_whoisactive"]
  block:
    # CI prefetches the script (WHOISACTIVE_LOCAL_FILE); otherwise download once with retries to avoid intermittent 403s.
    - name: Download sp_whoisactive script
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/amachanic/sp_whoisactive/master/sp_WhoIsActive.sql
        dest: "{{ whoisactive_local_file }}"
        mode: "0644"
        force: true
      register: download
      when: not whoisactive_prefetched_file
      until: download is succeeded
      retries: 5
      delay: 10

    - name: Install sp_whoisactive
      lowlydba.sqlserver.sp_whoisactive:
      register: result
    - assert:
        that:
          - result.data.Status != None
          - result.data.SqlInstance != None
          - result.data.ComputerName != None
          - result.data.InstanceName != None
          - result.data.Database == target_database
          - result.data.Version != None
          - result.data.Status in ('Installed', 'Updated')
          - result is changed

    - name: Update sp_whoisactive
      lowlydba.sqlserver.sp_whoisactive:
      register: result
    - assert:
        that:
          - result.data.SqlInstance != None
          - result.data.ComputerName != None
          - result.data.InstanceName != None
          - result.data.Database == target_database
          - result.data.Version != None
          - result.data.Status == 'Updated'
          - result is changed

    - name: Update sp_whoisactive in checkmode
      lowlydba.sqlserver.sp_whoisactive:
      register: result
      check_mode: true
    - assert:
        that:
          - result is changed
